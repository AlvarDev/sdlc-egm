<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RetroPulse — Sprint Retro Board</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #2563eb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 1.5rem;
    }
    h1 { font-size: 1.75rem; margin-bottom: 0.25rem; }
    p.subtitle { color: var(--muted); }
    form {
      display: flex;
      gap: 0.75rem;
      background: var(--card-bg);
      padding: 1rem;
      border-radius: 0.5rem;
      border: 1px solid var(--border);
      margin-bottom: 2rem;
    }
    input[type="text"] {
      flex: 1;
      padding: 0.6rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 0.375rem;
      font-size: 0.95rem;
    }
    select, button {
      padding: 0.6rem 1rem;
      border-radius: 0.375rem;
      border: 1px solid var(--border);
      font-size: 0.95rem;
      cursor: pointer;
    }
    button.primary {
      background: var(--primary);
      color: white;
      border: none;
      font-weight: 600;
    }
    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.25rem;
    }
    .column {
      background: #f1f5f9;
      padding: 1rem;
      border-radius: 0.5rem;
      min-height: 400px;
    }
    .column h2 {
      font-size: 1.1rem;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid var(--border);
    }
    .card {
      background: var(--card-bg);
      padding: 0.85rem;
      border-radius: 0.375rem;
      border: 1px solid var(--border);
      margin-bottom: 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
    }
    .upvote-btn {
      background: #eff6ff;
      color: var(--primary);
      border: 1px solid #bfdbfe;
      padding: 0.35rem 0.65rem;
      border-radius: 999px;
      font-weight: 600;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <header>
    <h1>RetroPulse</h1>
    <p class="subtitle">Lightweight Sprint Retrospective Board</p>
  </header>

  <form id="card-form">
    <input
      type="text"
      id="card-text"
      placeholder="Share a thought (max 280 chars)..."
      maxlength="280"
      required
    />
    <select id="card-category">
      <option value="Went Well">Went Well</option>
      <option value="To Improve">To Improve</option>
      <option value="Action Items">Action Items</option>
    </select>
    <button type="submit" class="primary">Add Card</button>
  </form>

  <section class="board">
    <div class="column">
      <h2>Went Well</h2>
      <div id="col-Went Well"></div>
    </div>
    <div class="column">
      <h2>To Improve</h2>
      <div id="col-To Improve"></div>
    </div>
    <div class="column">
      <h2>Action Items</h2>
      <div id="col-Action Items"></div>
    </div>
  </section>

  <script>
    const categories = ["Went Well", "To Improve", "Action Items"];

    async function loadCards() {
      const res = await fetch("/api/cards");
      const cards = await res.json();
      categories.forEach((cat) => {
        document.getElementById(`col-${cat}`).innerHTML = "";
      });
      cards.forEach((card) => {
        const col = document.getElementById(`col-${card.category}`);
        if (!col) return;
        const el = document.createElement("div");
        el.className = "card";
        const span = document.createElement("span");
        span.textContent = card.text;
        const btn = document.createElement("button");
        btn.className = "upvote-btn";
        btn.textContent = `▲ ${card.votes}`;
        btn.onclick = () => upvoteCard(card.id);
        el.appendChild(span);
        el.appendChild(btn);
        col.appendChild(el);
      });
    }

    async function upvoteCard(id) {
      await fetch(`/api/cards/${id}/upvote`, { method: "POST" });
      await loadCards();
    }

    document.getElementById("card-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const input = document.getElementById("card-text");
      const category = document.getElementById("card-category").value;
      const res = await fetch("/api/cards", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: input.value, category }),
      });
      if (res.ok) {
        input.value = "";
        await loadCards();
      }
    });

    loadCards();
  </script>
</body>
</html>
